# 파이프라인이 읽는 비밀값. 값을 채운 사본을 Kubeflow 사용자 네임스페이스(파이프라인이 도는 곳)에 만든다.
#   cp pipelines/k8s/secret.example.yaml /tmp/llm-ft-secrets.yaml && vi /tmp/llm-ft-secrets.yaml
#   kubectl -n <kubeflow-user-namespace> apply -f /tmp/llm-ft-secrets.yaml
# 저장소에는 값이 든 파일을 커밋하지 않는다. 빈 키는 지워도 된다 (파이프라인은 optional 로 읽음).
apiVersion: v1
kind: Secret
metadata:
  name: llm-ft-secrets
type: Opaque
stringData:
  SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/XXX/YYY/ZZZ"
  # MLflow artifact store (S3 또는 MinIO)
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  MLFLOW_S3_ENDPOINT_URL: ""          # MinIO 예: http://minio-service.kubeflow.svc.cluster.local:9000
  MLFLOW_TRACKING_USERNAME: ""
  MLFLOW_TRACKING_PASSWORD: ""
  HF_TOKEN: ""
